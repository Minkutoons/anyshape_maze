<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Tilt Ring Maze (Draw Boundary → Rings)</title>
  <style>
    html, body { margin:0; padding:0; height:100%; background:#111; overflow:hidden; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; }
    #ui {
      position: fixed; left: 10px; right: 10px; bottom: 10px;
      background: rgba(0,0,0,0.55); color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 14px; padding: 10px;
      backdrop-filter: blur(6px);
      display: grid; gap: 8px;
    }
    .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .row > * { flex: 1 1 auto; }
    label { font-size: 12px; opacity: 0.9; display:flex; justify-content:space-between; gap:8px; }
    input[type="range"] { width: 100%; }
    button {
      background:#1e88e5; color:#fff; border:none; border-radius: 12px; padding: 10px 12px;
      font-weight: 700; cursor:pointer;
    }
    button.secondary { background:#2e2e2e; }
    #hint {
      position: fixed; top: 10px; left: 10px; right: 10px;
      color: rgba(255,255,255,0.9);
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(6px);
      pointer-events:none;
    }
    a { color:#9fd3ff; }
    canvas { touch-action: none; }
  </style>
</head>
<body>
  <div id="hint">
    <b>Draw a closed shape</b> (any blob). Lift finger to build rings. Tilt phone to roll balls.<br/>
    Desktop: draw with mouse, use <b>arrow keys</b> to tilt.
  </div>

  <div id="ui">
    <div class="row">
      <button id="btnDraw" class="secondary">Draw Mode</button>
      <button id="btnBuild">Build Rings</button>
      <button id="btnReset" class="secondary">Reset</button>
      <button id="btnTilt" class="secondary">Enable Tilt</button>
    </div>

    <div class="row">
      <div style="flex:1 1 220px;">
        <label>Ball Size <span id="vBall">24</span></label>
        <input id="ballD" type="range" min="12" max="48" step="1" value="24">
      </div>
      <div style="flex:1 1 220px;">
        <label>Wall Thickness <span id="vWall">14</span></label>
        <input id="wallT" type="range" min="6" max="26" step="1" value="14">
      </div>
      <div style="flex:1 1 220px;">
        <label>Corner Softening <span id="vChamfer">18</span></label>
        <input id="chamfer" type="range" min="0" max="60" step="1" value="18">
      </div>
    </div>

    <div class="row">
      <div style="flex:1 1 220px;">
        <label>Balls <span id="vCount">4</span></label>
        <input id="ballN" type="range" min="1" max="10" step="1" value="4">
      </div>
      <div style="flex:1 1 220px;">
        <label>Gravity <span id="vG">1.0</span></label>
        <input id="grav" type="range" min="0.3" max="2.5" step="0.1" value="1.0">
      </div>
      <div style="flex:1 1 220px;">
        <label>Draw Smoothness <span id="vSmooth">6</span></label>
        <input id="smooth" type="range" min="2" max="16" step="1" value="6">
      </div>
    </div>
  </div>

  <!-- Matter.js CDN (works on GitHub Pages) -->
  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>

  <script>
    // ============== Matter.js Setup ==============
    const {
      Engine, Render, Runner, World, Bodies, Body, Composite, Events, Vector
    } = Matter;

    const engine = Engine.create();
    engine.gravity.scale = 0.001; // We'll set gravity dynamically

    const canvasW = () => window.innerWidth;
    const canvasH = () => window.innerHeight;

    const render = Render.create({
      element: document.body,
      engine,
      options: {
        width: canvasW(),
        height: canvasH(),
        wireframes: false,
        background: '#141414',
        pixelRatio: window.devicePixelRatio || 1
      }
    });

    Render.run(render);
    const runner = Runner.create();
    Runner.run(runner, engine);

    window.addEventListener('resize', () => {
      render.canvas.width = canvasW() * (window.devicePixelRatio || 1);
      render.canvas.height = canvasH() * (window.devicePixelRatio || 1);
      render.options.width = canvasW();
      render.options.height = canvasH();
      Render.lookAt(render, {
        min: { x: 0, y: 0 },
        max: { x: canvasW(), y: canvasH() }
      });
    });

    // ============== UI State ==============
    const ui = {
      drawMode: true,
      tiltEnabled: false,
      tiltX: 0,
      tiltY: 0
    };

    const el = {
      btnDraw: document.getElementById('btnDraw'),
      btnBuild: document.getElementById('btnBuild'),
      btnReset: document.getElementById('btnReset'),
      btnTilt: document.getElementById('btnTilt'),
      ballD: document.getElementById('ballD'),
      wallT: document.getElementById('wallT'),
      chamfer: document.getElementById('chamfer'),
      ballN: document.getElementById('ballN'),
      grav: document.getElementById('grav'),
      smooth: document.getElementById('smooth'),
      vBall: document.getElementById('vBall'),
      vWall: document.getElementById('vWall'),
      vChamfer: document.getElementById('vChamfer'),
      vCount: document.getElementById('vCount'),
      vG: document.getElementById('vG'),
      vSmooth: document.getElementById('vSmooth'),
    };

    function syncLabels() {
      el.vBall.textContent = el.ballD.value;
      el.vWall.textContent = el.wallT.value;
      el.vChamfer.textContent = el.chamfer.value;
      el.vCount.textContent = el.ballN.value;
      el.vG.textContent = Number(el.grav.value).toFixed(1);
      el.vSmooth.textContent = el.smooth.value;
    }
    ['input','change'].forEach(evt => {
      el.ballD.addEventListener(evt, syncLabels);
      el.wallT.addEventListener(evt, syncLabels);
      el.chamfer.addEventListener(evt, syncLabels);
      el.ballN.addEventListener(evt, syncLabels);
      el.grav.addEventListener(evt, syncLabels);
      el.smooth.addEventListener(evt, syncLabels);
    });
    syncLabels();

    // ============== Drawing Capture ==============
    let drawPoints = [];       // raw points
    let boundary = null;       // processed polygon points [{x,y},...]

    function getPointerPos(e) {
      const rect = render.canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function dist(a,b){ const dx=a.x-b.x, dy=a.y-b.y; return Math.hypot(dx,dy); }

    function rdpSimplify(points, epsilon) {
      // Ramer–Douglas–Peucker
      if (points.length < 3) return points.slice();
      const lineDist = (p, a, b) => {
        const A = p.x - a.x, B = p.y - a.y, C = b.x - a.x, D = b.y - a.y;
        const dot = A*C + B*D;
        const lenSq = C*C + D*D;
        let t = lenSq ? dot/lenSq : 0;
        t = Math.max(0, Math.min(1, t));
        const x = a.x + t*C, y = a.y + t*D;
        return Math.hypot(p.x - x, p.y - y);
      };
      const keep = new Array(points.length).fill(false);
      keep[0]=true; keep[points.length-1]=true;

      const stack = [[0, points.length-1]];
      while (stack.length) {
        const [s,e] = stack.pop();
        let maxD = 0, idx = -1;
        for (let i=s+1; i<e; i++) {
          const d = lineDist(points[i], points[s], points[e]);
          if (d > maxD) { maxD = d; idx = i; }
        }
        if (maxD > epsilon && idx !== -1) {
          keep[idx] = true;
          stack.push([s, idx], [idx, e]);
        }
      }
      return points.filter((_,i)=>keep[i]);
    }

    function polygonArea(pts){
      let a=0;
      for (let i=0;i<pts.length;i++){
        const p=pts[i], q=pts[(i+1)%pts.length];
        a += p.x*q.y - q.x*p.y;
      }
      return a/2;
    }

    function ensureClockwise(pts){
      // Matter doesn't require CW, but consistent orientation helps our offset math.
      if (polygonArea(pts) > 0) pts.reverse(); // make clockwise (negative area)
      return pts;
    }

    function closeIfBroken(pts) {
      if (pts.length < 3) return pts;
      const first = pts[0], last = pts[pts.length-1];
      const gap = dist(first,last);
      // If gap is significant, still close but do it smoothly later via chamfer.
      if (gap > 2) {
        pts.push({x:first.x, y:first.y});
      }
      return pts;
    }

    function fitToScreen(pts) {
      // Scale to ~88% of min dimension with margin
      const W = canvasW(), H = canvasH();
      let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
      for (const p of pts){
        minX=Math.min(minX,p.x); minY=Math.min(minY,p.y);
        maxX=Math.max(maxX,p.x); maxY=Math.max(maxY,p.y);
      }
      const bw = Math.max(1, maxX-minX);
      const bh = Math.max(1, maxY-minY);
      const target = 0.88 * Math.min(W,H);
      const s = target / Math.max(bw,bh);
      const cx = (minX+maxX)/2, cy=(minY+maxY)/2;
      const tx = W/2, ty = H/2;
      return pts.map(p => ({ x: (p.x - cx)*s + tx, y: (p.y - cy)*s + ty }));
    }

    function chamferPolygon(pts, chamferDist) {
      // Replace each vertex with two points along adjacent edges
      if (pts.length < 4 || chamferDist <= 0) return pts.slice();
      const out = [];
      const n = pts.length;
      for (let i=0;i<n;i++){
        const prev = pts[(i-1+n)%n];
        const curr = pts[i];
        const next = pts[(i+1)%n];

        const v1 = Vector.normalise({x: curr.x - prev.x, y: curr.y - prev.y});
        const v2 = Vector.normalise({x: next.x - curr.x, y: next.y - curr.y});

        const d1 = Math.min(chamferDist, dist(prev,curr)*0.45);
        const d2 = Math.min(chamferDist, dist(curr,next)*0.45);

        const pA = { x: curr.x - v1.x*d1, y: curr.y - v1.y*d1 };
        const pB = { x: curr.x + v2.x*d2, y: curr.y + v2.y*d2 };

        out.push(pA, pB);
      }
      // Remove near-duplicates
      const cleaned = [];
      for (const p of out){
        if (!cleaned.length || dist(p, cleaned[cleaned.length-1]) > 1.5) cleaned.push(p);
      }
      return cleaned;
    }

    function offsetPolygonInward(pts, offset) {
      // Simple polygon offset using averaged inward normals (works well after simplification + chamfer)
      // For a clockwise polygon, inward normal is to the RIGHT of edge direction.
      const n = pts.length;
      if (n < 3) return null;

      const normals = [];
      for (let i=0;i<n;i++){
        const a = pts[i];
        const b = pts[(i+1)%n];
        const dx = b.x - a.x, dy = b.y - a.y;
        const len = Math.hypot(dx,dy) || 1;
        // right-hand normal (dx,dy) => (dy,-dx)
        normals.push({ x: (dy/len), y: (-dx/len) });
      }

      const out = [];
      for (let i=0;i<n;i++){
        const n1 = normals[(i-1+n)%n];
        const n2 = normals[i];
        // average
        let nx = n1.x + n2.x;
        let ny = n1.y + n2.y;
        const l = Math.hypot(nx,ny) || 1;
        nx/=l; ny/=l;

        out.push({ x: pts[i].x + nx*offset, y: pts[i].y + ny*offset });
      }

      // Basic validity: area must remain sizeable
      const a = Math.abs(polygonArea(out));
      if (!isFinite(a) || a < 2000) return null;
      return out;
    }

    // ============== World Objects ==============
    const COLORS = {
      wall: '#e53935',
      wall2:'#c62828',
      ball: '#ffd54f'
    };

    let wallBodies = [];
    let ballBodies = [];

    function clearWorld() {
      for (const b of wallBodies) World.remove(engine.world, b);
      for (const b of ballBodies) World.remove(engine.world, b);
      wallBodies = [];
      ballBodies = [];
    }

    function addSegmentWall(p1, p2, thickness) {
      const mid = { x: (p1.x+p2.x)/2, y: (p1.y+p2.y)/2 };
      const dx = p2.x - p1.x, dy = p2.y - p1.y;
      const len = Math.hypot(dx,dy);
      if (len < 2) return null;
      const angle = Math.atan2(dy, dx);
      const rect = Bodies.rectangle(mid.x, mid.y, len, thickness, {
        isStatic: true,
        friction: 0.2,
        restitution: 0.1,
        render: { fillStyle: COLORS.wall }
      });
      Body.setAngle(rect, angle);
      return rect;
    }

    function buildWallsFromPolygon(poly, thickness, color) {
      const bodies = [];
      for (let i=0;i<poly.length;i++){
        const a = poly[i];
        const b = poly[(i+1)%poly.length];
        const w = addSegmentWall(a, b, thickness);
        if (w) {
          w.render.fillStyle = color;
          bodies.push(w);
        }
      }
      return bodies;
    }

    function spawnBalls(startPoly) {
      const D = Number(el.ballD.value);
      const r = D/2;
      const n = Number(el.ballN.value);

      // Spawn near a "top-left-ish" point on the outer ring corridor
      // We pick a point on startPoly with minimal (x+y)
      let best = startPoly[0], bestScore = best.x + best.y;
      for (const p of startPoly){
        const s = p.x + p.y;
        if (s < bestScore) { bestScore = s; best = p; }
      }

      for (let i=0;i<n;i++){
        const b = Bodies.circle(best.x + i*(D*1.1), best.y + i*(D*0.6), r, {
          friction: 0.02,
          frictionAir: 0.005,
          restitution: 0.15,
          density: 0.002,
          render: { fillStyle: COLORS.ball }
        });
        ballBodies.push(b);
        World.add(engine.world, b);
      }
    }

    // ============== Ring Builder ==============
    function buildRingsFromBoundary(boundaryPts) {
      clearWorld();
      if (!boundaryPts || boundaryPts.length < 3) return;

      const D = Number(el.ballD.value);
      const W = 2 * D;               // your 2× clearance rule
      const T = Number(el.wallT.value);
      const cham = Number(el.chamfer.value);

      // Apply chamfer to reduce sharp traps
      let B = chamferPolygon(boundaryPts, cham);
      B = ensureClockwise(B);

      // First inward offset so ball center stays inside
      const margin = (T/2) + (D/2) + 2;
      let outer = offsetPolygonInward(B, margin);
      if (!outer) return;

      // Build successive rings
      const step = W + T; // distance between successive boundary loops
      const maxRings = 30; // safety cap

      let ringIndex = 0;
      let prev = outer;

      // Outer boundary wall for ring1
      wallBodies.push(...buildWallsFromPolygon(prev, T, COLORS.wall));

      while (ringIndex < maxRings) {
        const next = offsetPolygonInward(prev, step);
        if (!next) break;

        // Inner boundary wall of this ring
        const col = (ringIndex % 2 === 0) ? COLORS.wall2 : COLORS.wall;
        wallBodies.push(...buildWallsFromPolygon(next, T, col));

        // Prepare next ring
        prev = next;
        ringIndex++;
      }

      World.add(engine.world, wallBodies);

      // Spawn balls using the first wall loop as reference
      spawnBalls(outer);
    }

    // ============== Draw Overlay (simple) ==============
    const overlay = document.createElement('canvas');
    overlay.style.position = 'fixed';
    overlay.style.left = 0;
    overlay.style.top = 0;
    overlay.style.pointerEvents = 'none';
    overlay.width = canvasW() * (window.devicePixelRatio || 1);
    overlay.height = canvasH() * (window.devicePixelRatio || 1);
    overlay.style.width = canvasW() + 'px';
    overlay.style.height = canvasH() + 'px';
    document.body.appendChild(overlay);

    function resizeOverlay() {
      overlay.width = canvasW() * (window.devicePixelRatio || 1);
      overlay.height = canvasH() * (window.devicePixelRatio || 1);
      overlay.style.width = canvasW() + 'px';
      overlay.style.height = canvasH() + 'px';
    }
    window.addEventListener('resize', resizeOverlay);

    function drawOverlayPath(points, closed=false) {
      const ctx = overlay.getContext('2d');
      const pr = window.devicePixelRatio || 1;
      ctx.clearRect(0,0,overlay.width,overlay.height);
      if (!points || points.length < 2) return;

      ctx.save();
      ctx.scale(pr, pr);
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.fillStyle = 'rgba(255,255,255,0.07)';
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i=1;i<points.length;i++) ctx.lineTo(points[i].x, points[i].y);
      if (closed) ctx.closePath();
      ctx.stroke();
      if (closed) ctx.fill();
      ctx.restore();
    }

    // ============== Pointer Events ==============
    let isDrawing = false;

    function startDraw(e){
      if (!ui.drawMode) return;
      isDrawing = true;
      drawPoints = [];
      const p = getPointerPos(e);
      drawPoints.push(p);
      drawOverlayPath(drawPoints, false);
    }
    function moveDraw(e){
      if (!ui.drawMode || !isDrawing) return;
      const p = getPointerPos(e);
      const last = drawPoints[drawPoints.length-1];
      if (!last || dist(p,last) > 2) drawPoints.push(p);
      drawOverlayPath(drawPoints, false);
    }
    function endDraw(){
      if (!ui.drawMode || !isDrawing) return;
      isDrawing = false;

      if (drawPoints.length < 10) {
        drawOverlayPath([], false);
        return;
      }

      // Process boundary
      const smoothEps = Number(el.smooth.value);
      let pts = rdpSimplify(drawPoints, smoothEps);

      // Remove consecutive duplicates / too-close
      const cleaned = [];
      for (const p of pts) {
        if (!cleaned.length || dist(p, cleaned[cleaned.length-1]) > 2) cleaned.push(p);
      }
      pts = cleaned;

      // Close and fit
      pts = closeIfBroken(pts);
      // If we appended first point to end, drop last duplicate for polygon ops:
      if (pts.length > 3 && dist(pts[0], pts[pts.length-1]) < 3) pts.pop();

      // Fit to screen so it uses most of phone area
      pts = fitToScreen(pts);

      boundary = pts;
      drawOverlayPath(boundary, true);

      // Auto-build after drawing
      buildRingsFromBoundary(boundary);
    }

    render.canvas.addEventListener('mousedown', startDraw);
    render.canvas.addEventListener('mousemove', moveDraw);
    window.addEventListener('mouseup', endDraw);

    render.canvas.addEventListener('touchstart', (e)=>{ e.preventDefault(); startDraw(e); }, {passive:false});
    render.canvas.addEventListener('touchmove', (e)=>{ e.preventDefault(); moveDraw(e); }, {passive:false});
    render.canvas.addEventListener('touchend', (e)=>{ e.preventDefault(); endDraw(); }, {passive:false});

    // ============== Tilt Control ==============
    function applyGravity(){
      const gScale = Number(el.grav.value);
      // tiltX, tiltY in [-1,1]
      engine.gravity.x = ui.tiltX * gScale;
      engine.gravity.y = ui.tiltY * gScale;
    }

    function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }

    async function enableTilt() {
      // iOS requires permission
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        const res = await DeviceOrientationEvent.requestPermission();
        if (res !== 'granted') throw new Error('Permission denied');
      }
      ui.tiltEnabled = true;
    }

    window.addEventListener('deviceorientation', (e) => {
      if (!ui.tiltEnabled) return;
      // beta: front-back (-180..180), gamma: left-right (-90..90)
      const gamma = e.gamma || 0; // left/right
      const beta  = e.beta  || 0; // front/back
      // normalize
      ui.tiltX = clamp(gamma / 30, -1, 1);
      ui.tiltY = clamp(beta  / 30, -1, 1);
      applyGravity();
    }, true);

    // Desktop keyboard fallback
    const keys = {ArrowLeft:false, ArrowRight:false, ArrowUp:false, ArrowDown:false};
    window.addEventListener('keydown', (e)=>{ if (e.key in keys) keys[e.key]=true; });
    window.addEventListener('keyup', (e)=>{ if (e.key in keys) keys[e.key]=false; });

    Events.on(engine, 'beforeUpdate', () => {
      // If tilt not enabled, allow keyboard tilt
      if (!ui.tiltEnabled) {
        const tx = (keys.ArrowRight?1:0) - (keys.ArrowLeft?1:0);
        const ty = (keys.ArrowDown?1:0) - (keys.ArrowUp?1:0);
        ui.tiltX = tx * 0.7;
        ui.tiltY = ty * 0.7;
        applyGravity();
      }
    });

    // ============== UI Buttons ==============
    el.btnDraw.onclick = () => {
      ui.drawMode = !ui.drawMode;
      el.btnDraw.textContent = ui.drawMode ? 'Draw Mode' : 'Play Mode';
      el.btnDraw.classList.toggle('secondary', ui.drawMode);
      // In play mode hide overlay
      if (!ui.drawMode) drawOverlayPath([], false);
      else if (boundary) drawOverlayPath(boundary, true);
    };

    el.btnBuild.onclick = () => {
      if (!boundary || boundary.length < 3) return;
      buildRingsFromBoundary(boundary);
    };

    el.btnReset.onclick = () => {
      boundary = null;
      drawPoints = [];
      drawOverlayPath([], false);
      clearWorld();
    };

    el.btnTilt.onclick = async () => {
      try {
        await enableTilt();
        el.btnTilt.textContent = 'Tilt Enabled';
        el.btnTilt.disabled = true;
      } catch (err) {
        alert('Tilt permission failed. On iPhone: Settings > Safari > Motion & Orientation Access.');
      }
    };

    // ============== Start with an example boundary (optional) ==============
    // Quick default blob so it works immediately without drawing
    function makeDefaultBoundary() {
      const W = canvasW(), H = canvasH();
      const pts = [];
      const cx = W/2, cy = H/2;
      const r = Math.min(W,H)*0.38;
      for (let i=0;i<18;i++){
        const a = (i/18)*Math.PI*2;
        const rr = r*(0.75 + 0.25*Math.sin(i*1.7));
        pts.push({ x: cx + Math.cos(a)*rr, y: cy + Math.sin(a)*rr });
      }
      boundary = ensureClockwise(pts);
      drawOverlayPath(boundary, true);
      buildRingsFromBoundary(boundary);
    }
    makeDefaultBoundary();
  </script>
</body>
</html>
